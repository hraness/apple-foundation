name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings
      - name: Build library and fake bridge
        run: cargo +1.85.0 build --all-targets --locked
      - name: Provider-free tests
        run: cargo +1.85.0 test --all-targets --locked

  required:
    name: Required
    if: always()
    needs: [rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          RUST: ${{ needs.rust.result }}
        run: |
          set -euo pipefail
          if [[ "$RUST" != success ]]; then
            printf 'Unexpected required job result: %s\n' "$RUST"
            exit 1
          fi
