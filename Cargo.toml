[package]
name = "apple-foundation"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hraness/apple-foundation"
description = "Product-neutral client for Apple's on-device Foundation Models framework: bounded NDJSON bridge, serialized queue, guided JSON output"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
