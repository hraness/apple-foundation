[package]
name = "apple-foundation"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hraness/apple-foundation"
description = "Rust client and Swift bridge for Apple's on-device Foundation Models, with schema-guided JSON output and one request at a time"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
